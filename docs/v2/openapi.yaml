openapi: 3.1.0
info:
  title: Aris API v2
  version: 2.0.0
  description: Unified v2 contract for conversation, memory, skills, and tasks.
servers:
  - url: /api
paths:
  /v2/messages:
    post:
      summary: Send message and get unified response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: Message response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v2/messages/stream:
    post:
      summary: Stream message response as SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: text/event-stream
  /v2/skills:
    get:
      summary: List installed skills
      responses:
        '200':
          description: Skill list
  /v2/skills/install:
    post:
      summary: Install custom skill metadata
      responses:
        '201':
          description: Installed
  /v2/skills/{name}:
    delete:
      summary: Delete custom skill
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /v2/memory:
    post:
      summary: Write long-term memory entry
      responses:
        '201':
          description: Created
  /v2/memory/search:
    get:
      summary: Search memory entries
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Search result
  /v2/tasks:
    get:
      summary: List tasks
      responses:
        '200':
          description: Task list
    post:
      summary: Create cron task
      responses:
        '201':
          description: Task created
  /v2/tasks/{id}:
    patch:
      summary: Update task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
  /v2/computer-use/jobs:
    post:
      summary: Create a computer-use job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerUseCreateRequest'
      responses:
        '201':
          description: Job created
  /v2/computer-use/jobs/{id}:
    get:
      summary: Get computer-use job by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job detail
  /v2/computer-use/jobs/{id}/confirm:
    post:
      summary: Confirm and continue a waiting computer-use job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Confirmed
  /v2/computer-use/jobs/{id}/cancel:
    post:
      summary: Cancel a computer-use job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
  /v2/computer-use/agent/poll:
    post:
      summary: Agent polls one runnable computer-use job
      responses:
        '200':
          description: Poll result
  /v2/computer-use/agent/report:
    post:
      summary: Agent reports step/final status
      responses:
        '200':
          description: Report accepted
  /v2/computer-use/agent/heartbeat:
    post:
      summary: Agent heartbeat
      responses:
        '200':
          description: Heartbeat accepted
components:
  schemas:
    MessageRequest:
      type: object
      required: [content, user_id]
      properties:
        content:
          type: string
        channel:
          type: string
          default: web
        user_id:
          type: string
        context_id:
          type: string
        attachments:
          type: array
          items:
            type: object
        metadata:
          type: object
    SafetyDecision:
      type: object
      required: [action, category, reason_code, confidence]
      properties:
        action:
          type: string
          enum: [pass, degrade, refuse]
        category:
          type: string
        reason_code:
          type: string
        confidence:
          type: number
    ToolCall:
      type: object
      required: [tool, status, duration_ms]
      properties:
        tool:
          type: string
        input:
          type: object
        output:
          oneOf:
            - type: object
            - type: string
            - type: 'null'
        status:
          type: string
          enum: [success, failed, skipped]
        error:
          type: [string, 'null']
        duration_ms:
          type: integer
    MessageResponse:
      type: object
      required:
        - id
        - content
        - persona
        - tool_calls
        - safety
        - memory_refs
        - usage
        - latency_ms
      properties:
        id:
          type: string
        content:
          type: string
        persona:
          type: string
          enum: [alice, professional]
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        safety:
          $ref: '#/components/schemas/SafetyDecision'
        memory_refs:
          type: array
          items:
            type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        latency_ms:
          type: integer
    ComputerUseCreateRequest:
      type: object
      required: [objective]
      properties:
        request_id:
          type: string
        user_id:
          type: string
        context_id:
          type: string
        objective:
          type: string
        trigger:
          type: string
        confirm_mode:
          type: string
          enum: [periodic, always, never]
        confirm_every_steps:
          type: integer
        step_max_retry:
          type: integer
        max_steps:
          type: integer
        metadata:
          type: object
    ComputerUseStep:
      type: object
      properties:
        index:
          type: integer
        action:
          type: string
        status:
          type: string
          enum: [success, failed, skipped]
        duration_ms:
          type: integer
        retry_count:
          type: integer
        error:
          type: [string, 'null']
        screenshot_ref:
          type: string
    ComputerUseJob:
      type: object
      properties:
        id:
          type: string
        request_id:
          type: string
        user_id:
          type: string
        context_id:
          type: string
        objective:
          type: string
        status:
          type: string
          enum: [queued, leased, running, waiting_confirmation, completed, failed, cancelled]
        confirm_mode:
          type: string
          enum: [periodic, always, never]
        confirm_every_steps:
          type: integer
        step_max_retry:
          type: integer
        max_steps:
          type: integer
        steps_executed:
          type: integer
        confirm_round:
          type: integer
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ComputerUseStep'
