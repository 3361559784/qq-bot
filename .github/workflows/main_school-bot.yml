# ⚡ 自动部署 Azure Functions 后端（OIDC）
name: Deploy Backend to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      # 只在后端代码变更时触发
      - 'src/**'
      - 'services/**'
      - 'host.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main_school-bot.yml'
  workflow_dispatch:  # 允许手动触发

env:
  AZURE_FUNCTIONAPP_NAME: 'school-bot'
  AZURE_RESOURCE_GROUP: 'qq-bot-rg'
  NODE_VERSION: '20.x'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies (backend only)
        run: |
          npm ci --production=false

      - name: ✅ Run backend tests
        run: |
          npm test

      - name: ✅ Verify backend entrypoint
        run: |
          npm run verify:runtime

  deploy-backend:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-school-bot-backend
      cancel-in-progress: true

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --production=false

      - name: 🔐 Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID || '' }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID || '' }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || '' }}

      - name: 🚀 Deploy to Azure Functions (Remote Build)
        run: |
          npm install -g azure-functions-core-tools@4
          func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME }} --build remote --javascript

      - name: ✅ Deployment complete
        run: |
          echo "🎉 后端部署成功！"
          echo "📍 URL: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/schoolbot"
