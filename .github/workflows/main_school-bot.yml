# ⚡ 自动部署 Azure Functions 后端 (仅后端，不部署前端)
name: Deploy Backend to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      # 只在后端代码变更时触发
      - 'src/**'
      - 'services/**'
      - 'host.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main_school-bot.yml'
  workflow_dispatch:  # 允许手动触发

env:
  AZURE_FUNCTIONAPP_NAME: 'school-bot'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies (backend only)
        run: |
          # 只安装根目录的依赖（Azure Functions）
          npm ci --production=false
          # 🚫 不进入 campus-ai-web 目录，避免触发前端构建

      - name: 🔐 Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Deploy to Azure Functions (Remote Build)
        run: |
          # 安装 Azure Functions Core Tools CLI
          npm install -g azure-functions-core-tools@4
          # 使用 func CLI 部署到 Azure Functions（远程构建模式，明确指定 Node.js 运行时）
          func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME }} --build remote --javascript

      - name: ✅ Deployment complete
        run: |
          echo "🎉 后端部署成功！"
          echo "📍 URL: https://school-bot-gwb4a9gkdwcyhde5.koreacentral-01.azurewebsites.net/api/schoolbot"
