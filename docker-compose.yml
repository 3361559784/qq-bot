services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schoolbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schoolbot}
      POSTGRES_DB: ${POSTGRES_DB:-schoolbot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://schoolbot:schoolbot@postgres:5432/schoolbot}
      ARIS_HTTP_PORT: ${ARIS_HTTP_PORT:-3000}
      ARIS_CU_TRANSPORT: ${ARIS_CU_TRANSPORT:-http_agent}
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ARIS_API_INTERNAL_BASE_URL: ${ARIS_API_INTERNAL_BASE_URL:-http://api:3000}
      ARIS_AUTH_KEY: ${ARIS_AUTH_KEY:-change_me_key}
      ARIS_AUTH_SIGNATURE_SECRET: ${ARIS_AUTH_SIGNATURE_SECRET:-change_me_signature_secret}
      ARIS_PROXY_TIMEOUT_MS: ${ARIS_PROXY_TIMEOUT_MS:-30000}
    depends_on:
      - api
    ports:
      - "3001:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://schoolbot:schoolbot@postgres:5432/schoolbot}
      ARIS_WORKER_ENABLED: ${ARIS_WORKER_ENABLED:-true}
    depends_on:
      - postgres

volumes:
  pgdata:
